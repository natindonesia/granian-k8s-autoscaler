# Non-spinning reserve: low-priority pause pods that hold node capacity. A new
# web pod preempts one immediately instead of waiting minutes for a node; the
# evicted placeholder goes Pending, which is the signal for a node autoscaler.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: overprovision
value: -10
preemptionPolicy: Never
description: Placeholder capacity; always preempted by real workloads.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovision
spec:
  replicas: 1
  selector:
    matchLabels: {app: overprovision}
  template:
    metadata:
      labels: {app: overprovision}
    spec:
      priorityClassName: overprovision
      terminationGracePeriodSeconds: 0
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 1500m, memory: 2Gi}   # size of one web pod
