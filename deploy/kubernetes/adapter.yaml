# Minimal plain-Kubernetes deployment (no Helm). Adjust names/namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: granian-k8s-autoscaler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: granian-k8s-autoscaler
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: ["web", "worker"]      # exactly the Deployments you scale
    verbs: ["get", "update"]              # update = compare-and-swap, up-only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: granian-k8s-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: granian-k8s-autoscaler
subjects:
  - kind: ServiceAccount
    name: granian-k8s-autoscaler
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: granian-k8s-autoscaler
data:
  config.json: |
    {
      "web": {
        "deployment": "web",
        "service": "web",
        "metrics_port": 9090,
        "min_replicas": 1,
        "max_replicas": 8,
        "threads_per_pod": 192,
        "target_utilization": 0.7
      },
      "redis": {"host": "redis", "queue_key": "rq:queue:{queue}"},
      "queues": [
        {"name": "workers", "deployment": "worker", "queues": ["default", "short", "long"],
         "min_replicas": 1, "max_replicas": 8}
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: granian-k8s-autoscaler
spec:
  selector:
    app: granian-k8s-autoscaler
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: granian-k8s-autoscaler
spec:
  replicas: 1
  # Single writer. Recreate (not RollingUpdate) so two instances never overlap;
  # the scale write is a compare-and-swap, but there is no reason to risk it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: granian-k8s-autoscaler
  template:
    metadata:
      labels:
        app: granian-k8s-autoscaler
    spec:
      serviceAccountName: granian-k8s-autoscaler
      containers:
        - name: autoscaler
          image: ghcr.io/natindonesia/granian-k8s-autoscaler:0.1.0   # pin by digest in production
          args: ["run", "--config", "/etc/granian-k8s-autoscaler/config.json"]
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - {name: config, mountPath: /etc/granian-k8s-autoscaler}
      volumes:
        - name: config
          configMap:
            name: granian-k8s-autoscaler
