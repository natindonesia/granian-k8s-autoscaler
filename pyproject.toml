[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "granian-k8s-autoscaler"
version = "0.1.0"
description = "Shock-resistant autoscaling signals and reflex for Granian web pods and RQ workers on Kubernetes (KEDA-friendly, no Helm required)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["kubernetes", "autoscaling", "keda", "granian", "rq", "hpa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6"]

[project.scripts]
granian-k8s-autoscaler = "granian_k8s_autoscaler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/granian_k8s_autoscaler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
